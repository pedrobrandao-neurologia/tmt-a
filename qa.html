<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA — Equivalência de formas TMT-A</title>
<style>
    :root{ --bg:#000;--panel:#0b0f17;--surface:#111827;--border:#1f2937;--border2:#374151;
        --text:#f0f2f5;--dim:#9ca3af;--primary:#3b82f6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:1rem;line-height:1.5}
    h1{font-size:1.3rem;margin-bottom:.25rem}
    p.sub{color:var(--dim);font-size:.85rem;margin-bottom:1rem}
    .controls{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.75rem;margin-bottom:1rem}
    .controls label{font-size:.85rem;color:var(--dim)}
    .controls input{width:80px;padding:.4rem;border-radius:6px;border:1px solid var(--border2);background:#0d1320;color:var(--text)}
    button{font-family:inherit;font-weight:600;border:none;border-radius:8px;padding:.55rem 1rem;cursor:pointer;background:var(--primary);color:#fff}
    button.sec{background:transparent;border:1px solid var(--border2);color:var(--text)}
    button:active{transform:scale(.97)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.9rem;margin-bottom:1.5rem}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:.6rem}
    .card.ref{border-color:var(--primary)}
    .card h3{font-size:.9rem;margin-bottom:.35rem;display:flex;justify-content:space-between;align-items:center}
    .badge{font-size:.68rem;font-weight:700;border-radius:20px;padding:.1rem .5rem}
    .badge.ok{background:var(--ok);color:#04210f}
    .badge.bad{background:var(--bad);color:#2a0606}
    .badge.ref{background:var(--primary);color:#fff}
    svg{width:100%;height:auto;display:block;background:#0d1320;border-radius:8px}
    .mini{font-size:.7rem;color:var(--dim);margin-top:.35rem;line-height:1.45}
    table{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:.5rem}
    th,td{border:1px solid var(--border);padding:.4rem .5rem;text-align:right}
    th:first-child,td:first-child{text-align:left}
    th{background:var(--surface);color:#cfe0ff}
    tr.ref{background:rgba(59,130,246,.12);font-weight:700}
    td.fail{color:var(--bad);font-weight:700}
    .note{font-size:.75rem;color:var(--dim);margin-top:1rem;line-height:1.5}
</style>
</head>
<body>
    <h1>QA — Equivalência de formas paralelas (TMT-A)</h1>
    <p class="sub">Renderiza a referência (original digitalizado) + N formas geradas, com métricas e selo de equivalência. Tudo offline, a partir de <code>layoutGenerator.js</code>. Reprodutível por seed.</p>

    <div class="controls">
        <label>seedStart <input id="seedStart" type="number" value="1"></label>
        <label>count <input id="count" type="number" value="6"></label>
        <button id="gen">Gerar</button>
        <button class="sec" id="csv">Export CSV</button>
        <button class="sec" id="json">Export JSON</button>
        <span id="status" class="mini"></span>
    </div>

    <div class="grid" id="grid"></div>
    <table id="metrics"></table>
    <p class="note" id="legend"></p>

    <script src="layoutGenerator.js"></script>
    <script>
        const G = window.LayoutGenerator;
        let currentSet = null;

        function svgForm(points, opts) {
            opts = opts || {};
            const W = 240, P = 16;
            const map = p => [P + p[0] * (W - 2 * P), P + p[1] * (W - 2 * P)];
            const trail = points.map((p, i) => { const m = map(p); return (i ? 'L' : 'M') + m[0].toFixed(1) + ' ' + m[1].toFixed(1); }).join(' ');
            let circles = '';
            points.forEach((p, i) => {
                const m = map(p);
                circles += `<circle cx="${m[0].toFixed(1)}" cy="${m[1].toFixed(1)}" r="9" fill="#1f2937" stroke="#4b5563" stroke-width="1.5"/>`;
                circles += `<text x="${m[0].toFixed(1)}" y="${(m[1] + 3.2).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#f0f2f5">${i + 1}</text>`;
            });
            const color = opts.ref ? '#3b82f6' : '#22c55e';
            return `<svg viewBox="0 0 ${W} ${W}"><path d="${trail}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/>${circles}</svg>`;
        }

        function render(set) {
            const ref = set.reference;
            const grid = document.getElementById('grid');
            let html = `<div class="card ref"><h3>Referência <span class="badge ref">original</span></h3>${svgForm(ref.points, { ref: true })}
                <div class="mini">len ${ref.metrics.totalLength.toFixed(2)} · passo ${ref.metrics.meanStep.toFixed(2)}±${ref.metrics.sdStep.toFixed(2)} · hull ${(ref.metrics.hullPct * 100).toFixed(0)}% · vira ${ref.metrics.turnMean.toFixed(0)}° · nd20 ${ref.metrics.nearDistractors.r20.toFixed(2)} · cruz ${ref.metrics.crossings}</div></div>`;
            set.forms.forEach((f, i) => {
                const eq = G.isEquivalent(f.metrics, ref.metrics, set.tolerances);
                html += `<div class="card"><h3>v${i + 1} (seed ${f.seed}) <span class="badge ${eq.equivalent ? 'ok' : 'bad'}">${eq.equivalent ? 'equivalente' : 'fora'}</span></h3>${svgForm(f.points)}
                    <div class="mini">len ${f.metrics.totalLength.toFixed(2)} · passo ${f.metrics.meanStep.toFixed(2)}±${f.metrics.sdStep.toFixed(2)} · hull ${(f.metrics.hullPct * 100).toFixed(0)}% · vira ${f.metrics.turnMean.toFixed(0)}° · nd20 ${f.metrics.nearDistractors.r20.toFixed(2)} · cruz ${f.metrics.crossings}</div></div>`;
            });
            grid.innerHTML = html;
            renderTable(set);
            document.getElementById('legend').textContent =
                'Tolerâncias: hull ±' + set.tolerances.hullPct + ', comprimento ±' + (set.tolerances.lengthRel * 100) + '%, passo médio ±' + set.tolerances.meanStep +
                ', dp passo ±' + set.tolerances.sdStep + ', viradas ±' + set.tolerances.turnMean + '°, near-distractors ±' + set.tolerances.nd + ', cruzamentos = ' + set.tolerances.crossings + '. Vermelho = fora da janela.';
        }

        function renderTable(set) {
            const ref = set.reference.metrics, tol = set.tolerances;
            const cols = [['forma', null], ['seed', null], ['comprimento', 'len'], ['passo', 'mean'], ['dp', 'sd'],
                ['hull %', 'hull'], ['vira °', 'turn'], ['nd20', 'nd'], ['cruz', 'cross']];
            let h = '<thead><tr>' + cols.map(c => '<th>' + c[0] + '</th>').join('') + '</tr></thead><tbody>';
            const cell = (v, fail) => '<td class="' + (fail ? 'fail' : '') + '">' + v + '</td>';
            h += '<tr class="ref"><td>REFERÊNCIA</td><td>—</td>' +
                cell(ref.totalLength.toFixed(2)) + cell(ref.meanStep.toFixed(2)) + cell(ref.sdStep.toFixed(2)) +
                cell((ref.hullPct * 100).toFixed(0)) + cell(ref.turnMean.toFixed(0)) + cell(ref.nearDistractors.r20.toFixed(2)) + cell(ref.crossings) + '</tr>';
            set.forms.forEach((f, i) => {
                const m = f.metrics;
                h += '<tr><td>v' + (i + 1) + '</td><td>' + f.seed + '</td>' +
                    cell(m.totalLength.toFixed(2), Math.abs(m.totalLength - ref.totalLength) / ref.totalLength > tol.lengthRel) +
                    cell(m.meanStep.toFixed(2), Math.abs(m.meanStep - ref.meanStep) > tol.meanStep) +
                    cell(m.sdStep.toFixed(2), Math.abs(m.sdStep - ref.sdStep) > tol.sdStep) +
                    cell((m.hullPct * 100).toFixed(0), Math.abs(m.hullPct - ref.hullPct) > tol.hullPct) +
                    cell(m.turnMean.toFixed(0), Math.abs(m.turnMean - ref.turnMean) > tol.turnMean) +
                    cell(m.nearDistractors.r20.toFixed(2), Math.abs(m.nearDistractors.critical - ref.nearDistractors.critical) > tol.nd) +
                    cell(m.crossings, m.crossings !== tol.crossings) + '</tr>';
            });
            document.getElementById('metrics').innerHTML = h + '</tbody>';
        }

        function generate() {
            const seedStart = parseInt(document.getElementById('seedStart').value, 10) || 1;
            const count = parseInt(document.getElementById('count').value, 10) || 6;
            document.getElementById('status').textContent = 'gerando…';
            setTimeout(() => {
                const t0 = performance.now();
                currentSet = G.generateEquivalentSet({ seedStart, count });
                render(currentSet);
                document.getElementById('status').textContent =
                    currentSet.count + '/' + count + ' equivalentes (seeds testados: ' + currentSet.triedSeeds + ', ' + Math.round(performance.now() - t0) + ' ms)';
            }, 20);
        }

        function download(name, text, type) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
            URL.revokeObjectURL(a.href);
        }

        document.getElementById('gen').addEventListener('click', generate);
        document.getElementById('csv').addEventListener('click', () => currentSet && download('tmt_qa.csv', G.toCSV(currentSet), 'text/csv'));
        document.getElementById('json').addEventListener('click', () => currentSet && download('tmt_qa.json', G.toJSON(currentSet), 'application/json'));
        generate();
    </script>
</body>
</html>
